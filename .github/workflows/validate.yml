name: Validate portfolio
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/qa-cms-build.mjs
      - run: node scripts/verify-dist.mjs

  visual-qa:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright-core
      - run: npm run build
      - name: Browser test and screenshots
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Using Chrome: $CHROME_BIN"
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/portofolio/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-visual.mjs
          node scripts/qa-admin.mjs
      - name: Save responsive previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-responsive-previews
          path: |
            qa-desktop.jpg
            qa-mobile.jpg
            qa-admin-desktop.jpg
            qa-admin-mobile.jpg
          if-no-files-found: warn

  public-admin-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public admin route and assets
        shell: bash
        run: |
          set -euo pipefail
          site="https://hackus-mans.github.io/portofolio/admin/"
          curl -fLsS --retry 3 --max-time 30 -H "Cache-Control: no-cache" "$site?revision=admin-studio-20261013" -o /tmp/admin.html
          grep -Fq "admin-login-form" /tmp/admin.html
          grep -Fq "admin-shell" /tmp/admin.html
          grep -Fq "admin-editor-form" /tmp/admin.html
          grep -Fq "Content-Security-Policy" /tmp/admin.html
          grep -Fq 'noindex,nofollow,noarchive' /tmp/admin.html
          echo "PASS: admin portal responds from GitHub Pages"
          for route in "" projects/ ctf/ certifications/ journal/; do
            code="$(curl -Ls -o /dev/null -w '%{http_code}' "https://hackus-mans.github.io/portofolio/$route")"
            echo "$route -> HTTP $code"
            test "$code" = "200"
          done
          echo "PASS: portfolio public routes intact"
