name: Validate portfolio
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-dist.mjs

  visual-qa:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright-core
      - run: npm run build
      - name: Browser test and screenshots
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Using Chrome: $CHROME_BIN"
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/portofolio/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-visual.mjs
      - name: Save responsive previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-responsive-previews
          path: |
            qa-desktop.jpg
            qa-mobile.jpg
          if-no-files-found: warn

  published-responsive-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed portfolio, Journal and responsive styles
        shell: bash
        run: |
          set -euo pipefail
          baseUrl="https://hackus-mans.github.io/portofolio/"
          curl -fLsS --retry 3 --max-time 30 -H "Cache-Control: no-cache" "$baseUrl?rev=polished-v7" -o /tmp/page.html
          grep -Fq "Comprendre. Construire." /tmp/page.html
          grep -Fq "Security Constellation" /tmp/page.html
          grep -Fq "Exercices d'investigation" /tmp/page.html
          grep -Fq 'id="journal"' /tmp/page.html
          css="$(grep -oE '/portofolio/_astro/[^" ]+\.css' /tmp/page.html | head -1)"
          test -n "$css"
          curl -fLsS --max-time 30 "https://hackus-mans.github.io$css" -o /tmp/style.css
          grep -Fq '.cc-map-viewport' /tmp/style.css
          grep -Fq '.cc-publications' /tmp/style.css
          echo "PASS: updated dashboard, Journal and responsive CSS are publicly served"
          for route in projects/ labs/ notes/ writeups/ roadmap/ journal/ projects/cybermind-x/; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' "$baseUrl$route")"
            echo "$route -> $status"
            test "$status" = "200"
          done
