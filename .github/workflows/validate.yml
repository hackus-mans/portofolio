name: Validate portfolio
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-dist.mjs

  visual-qa:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright-core
      - run: npm run build
      - name: Browser test and screenshots
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Using Chrome: $CHROME_BIN"
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/portofolio/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-visual.mjs
      - name: Save responsive previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-responsive-previews
          path: |
            qa-desktop.jpg
            qa-mobile.jpg
          if-no-files-found: warn

  verify-atlas-v6-public:
    runs-on: ubuntu-latest
    steps:
      - name: Check the meaning-first production dashboard
        shell: bash
        run: |
          set -euo pipefail
          url="https://hackus-mans.github.io/portofolio/?v=meaningful-atlas-v6"
          curl --fail --location --silent --show-error --max-time 30 -H "Cache-Control: no-cache" "$url" -o /tmp/atlas.html
          grep -Fq "Security Constellation" /tmp/atlas.html
          grep -Fq "data-inspector-relations" /tmp/atlas.html
          grep -Fq "data-dialog-observables" /tmp/atlas.html
          grep -Fq "data-metric-info" /tmp/atlas.html
          css="$(grep -oE '/portofolio/_astro/[^" ]+\.css' /tmp/atlas.html | head -1)"
          test -n "$css"
          curl --fail --location --silent --show-error --max-time 30 "https://hackus-mans.github.io$css" -o /tmp/atlas.css
          grep -Fq ".cc-inspector-relations" /tmp/atlas.css
          echo "SUCCESS: meaningful Atlas interface and stylesheet are live."
          for urlpath in projects/ projects/cybermind-x/ labs/ writeups/ notes/ roadmap/; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' "https://hackus-mans.github.io/portofolio/$urlpath")"
            echo "$urlpath -> $status"
            test "$status" = 200
          done
