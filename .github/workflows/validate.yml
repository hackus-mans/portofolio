name: Validate portfolio and Codespaces lab
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate devcontainer JSON
        run: node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json','utf8')); console.log('devcontainer.json valid')"
      - name: Validate lab scripts
        run: |
          bash -n .devcontainer/setup-lab.sh
          bash -n .devcontainer/welcome.sh
          bash -n lab/check-environment.sh
      - name: Build Codespaces image
        run: docker build -t portfolio-codespaces-lab:test .devcontainer
