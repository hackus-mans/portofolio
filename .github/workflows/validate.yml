name: Validate portfolio and sandbox
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate sandbox gateway
        working-directory: sandbox-server
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Build disposable Linux image
        run: docker build -t portfolio-sandbox:test sandbox-server/sandbox-image
