name: Deploy Astro portfolio
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: withastro/action@v6
  browser-qa:
    name: Browser QA — all pages and mobile
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright-core
      - run: npm run build
      - run: node scripts/verify-dist.mjs
      - name: Exercise site in Chromium
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/shade-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/portofolio/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-visual.mjs
      - name: Save SHADE browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shade-full-browser-qa
          path: qa/screenshots/
          if-no-files-found: ignore
  deploy:
    needs: [build, browser-qa]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: Verify public SHADE URLs
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://hackus-mans.github.io/portofolio"
          for path in "/" "/writeups/" "/writeups/obsidian/responder-8a77bd0b2a/" "/writeups/obsidian/three-df84494374/"; do
            url="$base$path"
            echo "Checking $url"
            success=0
            for attempt in {1..6}; do
              status=$(curl --location --silent --show-error --output /tmp/shade-response.html --write-out '%{http_code}' --max-time 25 "$url") || status=000
              echo "Attempt $attempt: HTTP $status"
              if [[ "$status" == "200" ]]; then
                success=1
                break
              fi
              sleep 5
            done
            if [[ "$success" != 1 ]]; then
              echo "::error::Public page not responding with HTTP 200: $url"
              exit 1
            fi
          done
          echo "All public SHADE URLs responded with HTTP 200."
